name: Build Klei Gift Watcher APK
on:
  push:
    branches:
      - klei-gift-watcher-android
    paths:
      - 'KleiGiftWatcher/**'
      - '.github/workflows/build-klei-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure required Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle --no-daemon -p KleiGiftWatcher :app:assembleDebug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KleiGiftWatcher-debug-apk
          path: KleiGiftWatcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
