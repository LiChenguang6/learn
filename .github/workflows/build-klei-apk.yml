name: Build Klei Gift Watcher APK
on:
  push:
    branches:
      - klei-gift-watcher-android
      - klei-gift-watcher-diagnostics-v0.4.2
    paths:
      - 'KleiGiftWatcher/**'
      - '.github/workflows/build-klei-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure required Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Test claim page classification
        run: node --test KleiGiftWatcher/tests/claim-page.test.cjs
      - name: Assemble debug APK
        run: gradle --no-daemon -p KleiGiftWatcher :app:assembleDebug :app:lintDebug
      # Verification run: confirm repository signing secrets produce a stable-signed APK.
      # Keep the private key OUT of the public repository and CI artifacts.
      # If these four repository secrets are configured, sign with the stable key.
      - name: Sign with stable private key (only when secrets are configured)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.KLEI_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.KLEI_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.KLEI_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KLEI_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ] && [ -n "$SIGNING_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            umask 077
            KEYSTORE="$RUNNER_TEMP/klei_signing.p12"
            trap 'rm -f "$KEYSTORE"' EXIT
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            export SIGNING_PASSWORD SIGNING_KEY_PASSWORD
            SIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
            "$SIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$SIGNING_ALIAS" \
              --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
              --out KleiGiftWatcher/app/build/outputs/apk/debug/KleiGiftWatcher-fixed.apk \
              KleiGiftWatcher/app/build/outputs/apk/debug/app-debug.apk
            "$SIGNER" verify --verbose --print-certs KleiGiftWatcher/app/build/outputs/apk/debug/KleiGiftWatcher-fixed.apk
            # Match the certificate of the user's existing 0.4.1 APK.
            "$SIGNER" verify --print-certs KleiGiftWatcher/app/build/outputs/apk/debug/KleiGiftWatcher-fixed.apk > "$RUNNER_TEMP/klei-public-certificate.txt"
            grep -Fq 'Signer #1 certificate SHA-256 digest: 720cedd9b597873f00be628269a99a98f7e0bc010f46e75b183a5a99f88894bb' "$RUNNER_TEMP/klei-public-certificate.txt"
            rm -f "$KEYSTORE"
          else
            echo "Signing secrets are not configured; exporting the debug APK and signing utility instead."
          fi
      - name: Upload fixed-signature APK if available
        uses: actions/upload-artifact@v4
        with:
          name: KleiGiftWatcher-fixedsigned-apk
          path: KleiGiftWatcher/app/build/outputs/apk/debug/KleiGiftWatcher-fixed.apk
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KleiGiftWatcher-debug-apk
          path: KleiGiftWatcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Export public Android signing tool (no keys)
        run: |
          mkdir -p signing-tools
          cp "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          java -jar signing-tools/apksigner.jar version
      - name: Upload Android signer utility
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-jar
          path: signing-tools/apksigner.jar
          if-no-files-found: error
